### `index.html`

```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Admission Form</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f5f9;
            padding: 30px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #1e3a8a;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        /* CSS Grid Layout */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            margin-bottom: 7px;
            font-weight: bold;
            color: #333;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus,
        select:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .gender-options {
            display: flex;
            gap: 20px;
            padding-top: 10px;
        }

        .gender-options label {
            font-weight: normal;
        }

        .buttons {
            grid-column: 1 / -1;
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        button {
            padding: 12px 30px;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .submit {
            background: #2563eb;
            color: white;
        }

        .reset {
            background: #e5e7eb;
            color: #333;
        }

        .submit:hover {
            background: #1d4ed8;
        }

        .reset:hover {
            background: #d1d5db;
        }

        /* Tablet */
        @media (max-width: 768px) {
            body {
                padding: 20px;
            }

            .container {
                padding: 25px;
            }

            .form-grid {
                grid-template-columns: 1fr 1fr;
                gap: 15px;
            }
        }

        /* Mobile */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px 15px;
            }

            h1 {
                font-size: 24px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            .buttons {
                grid-column: auto;
                flex-direction: column;
            }

            button {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Student Admission Form</h1>
        <p class="subtitle">Please fill in the details below</p>

        <form class="form-grid">

            <div class="form-group">
                <label for="fname">First Name</label>
                <input type="text" id="fname" placeholder="Enter first name" required>
            </div>

            <div class="form-group">
                <label for="lname">Last Name</label>
                <input type="text" id="lname" placeholder="Enter last name" required>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth</label>
                <input type="date" id="dob" required>
            </div>

            <div class="form-group">
                <label>Gender</label>

                <div class="gender-options">
                    <label>
                        <input type="radio" name="gender" value="male">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender" value="female">
                        Female
                    </label>

                    <label>
                        <input type="radio" name="gender" value="other">
                        Other
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="example@gmail.com" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter phone number" required>
            </div>

            <div class="form-group">
                <label for="course">Course</label>

                <select id="course" required>
                    <option value="">Select Course</option>
                    <option>B.Tech</option>
                    <option>B.Sc</option>
                    <option>B.Com</option>
                    <option>BBA</option>
                    <option>MCA</option>
                    <option>M.Tech</option>
                </select>
            </div>

            <div class="form-group">
                <label for="qualification">Previous Qualification</label>
                <input type="text" id="qualification"
                       placeholder="e.g. Intermediate / Diploma">
            </div>

            <div class="form-group full">
                <label for="address">Address</label>
                <textarea id="address"
                          placeholder="Enter your complete address"></textarea>
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" placeholder="Enter city">
            </div>

            <div class="form-group">
                <label for="pincode">PIN Code</label>
                <input type="text" id="pincode" placeholder="Enter PIN code">
            </div>

            <div class="form-group full">
                <label for="photo">Upload Student Photo</label>
                <input type="file" id="photo" accept="image/*">
            </div>

            <div class="buttons">
                <button type="submit" class="submit">
                    Submit Application
                </button>

                <button type="reset" class="reset">
                    Reset Form
                </button>
            </div>

        </form>
    </div>

</body>
</html>
```
